name: Build Spotter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install opencv-python Pillow pyinstaller
          sudo apt-get install -y librsvg2-bin

      - name: Download models
        run: |
          mkdir -p model
          curl -sL -o model/face_detection_yunet_2023mar.onnx \
            "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          curl -sL -o model/face_recognition_sface_2021dec.onnx \
            "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean spotter.spec

      - name: Convert icon to PNG
        run: rsvg-convert -w 256 -h 256 assets/spotter.svg > assets/spotter.png

      - name: Build .deb package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-1.0.0}"
          DEB_NAME="spotter_${VERSION}_amd64"
          DEB_ROOT="dist/${DEB_NAME}"

          mkdir -p "${DEB_ROOT}/opt/spotter"
          cp -r dist/spotter/. "${DEB_ROOT}/opt/spotter/"

          mkdir -p "${DEB_ROOT}/usr/share/applications"
          cp spotter.desktop "${DEB_ROOT}/usr/share/applications/"

          mkdir -p "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps"
          cp assets/spotter.png "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps/"

          mkdir -p "${DEB_ROOT}/usr/local/bin"
          ln -sf /opt/spotter/spotter "${DEB_ROOT}/usr/local/bin/spotter"

          mkdir -p "${DEB_ROOT}/DEBIAN"
          cat > "${DEB_ROOT}/DEBIAN/control" << CTRL
          Package: spotter
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgl1, libglib2.0-0, libsm6, libxext6, libxrender1, libxcb1
          Maintainer: Spotter Dev <spotter@localhost>
          Description: Live face detection, recognition, and tracking
           Spotter detects and recognizes faces from your webcam in real-time.
          Installed-Size: $(du -sk "${DEB_ROOT}/opt/spotter" | cut -f1)
          CTRL
          # Remove leading whitespace from heredoc (YAML indent)
          sed -i 's/^          //' "${DEB_ROOT}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${DEB_ROOT}"
          mv "dist/${DEB_NAME}.deb" dist/spotter-linux-amd64.deb

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotter-linux-amd64
          path: dist/spotter-linux-amd64.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install opencv-python Pillow pyinstaller

      - name: Download models
        run: |
          mkdir model -Force
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" -OutFile "model/face_detection_yunet_2023mar.onnx"
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" -OutFile "model/face_recognition_sface_2021dec.onnx"
        shell: pwsh

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean spotter.spec

      - name: Create Inno Setup script
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { "1.0.0" }
          @"
          [Setup]
          AppName=Spotter
          AppVersion=$version
          AppPublisher=Spotter
          DefaultDirName={autopf}\Spotter
          DefaultGroupName=Spotter
          UninstallDisplayIcon={app}\spotter.exe
          OutputDir=dist
          OutputBaseFilename=SpotterSetup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "dist\spotter\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\Spotter"; Filename: "{app}\spotter.exe"
          Name: "{autodesktop}\Spotter"; Filename: "{app}\spotter.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\spotter.exe"; Description: "Launch Spotter"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -Encoding UTF8 spotter-installer.iss
        shell: pwsh

      - name: Build installer with Inno Setup
        run: iscc spotter-installer.iss
        shell: cmd

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotter-windows-x64
          path: dist/SpotterSetup.exe

  release:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spotter-linux-amd64/spotter-linux-amd64.deb
            spotter-windows-x64/SpotterSetup.exe
          generate_release_notes: true
